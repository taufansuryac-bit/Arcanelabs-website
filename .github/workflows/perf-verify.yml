name: Performance Verification

on:
  push:
    branches:
      - perf/zero-visual-regression
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test src/lib/animation-runtime.test.ts
