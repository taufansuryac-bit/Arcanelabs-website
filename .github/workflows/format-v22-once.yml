name: Format V22 Once

on:
  push:
    branches:
      - feature/arcane-redesign-v2
    paths:
      - .github/workflows/format-v22-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arcane-redesign-v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/components/VoxelChaosLogoScene.tsx src/components/ProjectScrapbookOrbit.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VoxelChaosLogoScene.tsx src/components/ProjectScrapbookOrbit.tsx
          git commit -m "style: format redesign v2.2" || exit 0
          git push
