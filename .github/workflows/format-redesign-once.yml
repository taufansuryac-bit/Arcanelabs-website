name: Format Redesign Once

on:
  push:
    branches:
      - feature/arcane-redesign-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arcane-redesign-v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format redesign files
        run: bunx prettier --write src/components/ArcaneLoader.tsx src/components/GridHoverBackground.tsx src/components/SectionPixelReveal.tsx src/components/InteractiveTicker.tsx src/components/IdentityConstellation.tsx src/components/VoxelArcaneLogo.tsx src/components/MetaversePortalV2.tsx src/routes/index.tsx src/redesign-v2.css src/lib/animation-runtime.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ArcaneLoader.tsx src/components/GridHoverBackground.tsx src/components/SectionPixelReveal.tsx src/components/InteractiveTicker.tsx src/components/IdentityConstellation.tsx src/components/VoxelArcaneLogo.tsx src/components/MetaversePortalV2.tsx src/routes/index.tsx src/redesign-v2.css src/lib/animation-runtime.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format Arcane redesign v2"
            git push
          fi
